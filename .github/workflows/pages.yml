name: Deploy ClipSignal Pages
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clipsignal-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event.repository.private == false && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/check-okf.mjs
      - run: node tools/release.mjs check
      - run: node --test tests/pages.mjs
      - run: node tools/build-pages.mjs dist-pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages
  deploy:
    if: github.event.repository.private == false && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Verify public visibility before deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: test "$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)" = false
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
